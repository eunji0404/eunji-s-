<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑크빛 나의 웹페이지 🌸</title>
    <style>
        /* 페이지 전체 핑크 테마 설정 */
        body {
            background-color: #ffe6f2; /* 연한 핑크색 배경 */
            color: #ff66a3; /* 진한 핑크색 글씨 */
            font-family: 'Comic Sans MS', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* 하얀색 귀여운 박스 */
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.2);
            text-align: center;
            border: 4px dashed #ffb3d9; /* 점선 테두리 */
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        /* 두근두근 하트 애니메이션 */
        .heart {
            color: #ff3385;
            font-size: 4em;
            margin: 0;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 핑크 버튼 */
        button {
            background-color: #ff99c2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(255, 153, 194, 0.4);
        }

        button:hover {
            background-color: #ff66a3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">💖</div>
        <h1>안녕! 반가워요 (❁´◡`❁)</h1>
        <p>여기는 정말 귀엽고 핑크핑크한 페이지랍니다.<br>나만의 예쁜 웹사이트를 꾸며보세요!</p>
        <button onclick="alert('꺄! 🌸 버튼을 눌러주셔서 감사해요 💕')">여기를 클릭해봐요!</button>
    </div>

</body>
</html>
